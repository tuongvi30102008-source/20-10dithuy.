<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi dì Thuý</title>
<meta name="description" content="Thư chúc mừng 20/10 cháu gửi dì Thuý">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7dde2;
    --bg-2: #f2c9d1;
    --ink: #4a2a30;
    --ink-soft: #7a5058;
    --red: #a51d31;
    --red-dark: #861426;
    --red-light: #be2b42;
    --paper: #fffaf4;
    --gold-1: #f6dc8a;
    --gold-2: #c99a34;
    --gold-3: #8f6516;
    --env-w: min(340px, 84vw);
    --cream: #f3ebdf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    /* giấy kem có vân, giống màn đầu của web mẫu */
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.28'/></svg>"),
      radial-gradient(1000px 700px at 50% 40%, #fbf6ee 0%, transparent 70%),
      var(--cream);
    color: var(--ink);
    font-family: "Lora", Georgia, serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- cánh hoa rơi ---------- */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -40px;
    width: 14px; height: 11px;
    background: linear-gradient(135deg, #ffc2cf, #f08aa0);
    border-radius: 150% 0 150% 0;
    opacity: .75;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -5vh) rotate(0deg); }
    25%  { transform: translate(28px, 22vh) rotate(90deg); }
    50%  { transform: translate(-18px, 50vh) rotate(180deg); }
    75%  { transform: translate(24px, 78vh) rotate(270deg); }
    100% { transform: translate(0, 108vh) rotate(360deg); }
  }

  .stage {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px;
    overflow-x: clip;
  }
  [hidden] { display: none !important; }

  /* ---------- màn 1 + 2: phong bì ---------- */
  .title {
    font-family: "Playfair Display", serif;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--red-dark);
    font-size: clamp(22px, 5vw, 34px);
    text-align: center;
    transition: opacity .5s, transform .5s;
  }
  .date {
    margin-top: 8px;
    font-family: "Dancing Script", cursive;
    font-size: 20px; color: var(--ink-soft);
    transition: opacity .5s;
  }

  .mailbox {
    position: relative;
    margin-top: 34px;
    width: calc(var(--env-w) + 36px);
    display: flex; flex-direction: column; align-items: center;
  }
  .slot {
    position: relative; z-index: 6;
    width: 100%; height: 48px;
    border-radius: 12px;
    background: linear-gradient(180deg, #f4f4f4 0%, #c9cbcf 45%, #e9eaec 60%, #a9acb2 100%);
    box-shadow: 0 6px 14px rgba(80, 30, 40, .18), inset 0 1px 0 #fff;
    transition: opacity .6s, transform .6s;
  }
  .slot::after {
    content: ""; position: absolute; left: 14px; right: 14px; top: 20px; height: 9px;
    border-radius: 6px; background: #3b3d42; box-shadow: inset 0 2px 3px #000;
  }
  .window {
    position: relative;
    margin-top: -20px; padding-top: 20px;
    width: var(--env-w);
    overflow: hidden;
  }
  .window.free { overflow: visible; }

  .envelope {
    position: relative;
    width: var(--env-w);
    height: calc(var(--env-w) * .64);
    perspective: 900px;
    cursor: pointer;
    transform: translateY(-110%);
    transition: transform .9s cubic-bezier(.2, .8, .2, 1);
  }
  .envelope.out { transform: translateY(0); }
  .envelope.wiggle { animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-2.5deg); }
    82% { transform: rotate(2.5deg); }
    88% { transform: rotate(-1.5deg); }
    94% { transform: rotate(1deg); }
  }
  .env-back {
    position: absolute; inset: 0; border-radius: 6px;
    background: var(--red-dark);
    box-shadow: 0 18px 36px rgba(120, 20, 40, .28);
  }
  .letter-peek {
    position: absolute; left: 6%; right: 6%; bottom: 5%; height: 90%;
    z-index: 2;
    background: var(--paper);
    border-radius: 4px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    transition: transform .9s cubic-bezier(.2, .8, .2, 1) .45s;
    display: flex; flex-direction: column; align-items: center;
  }
  .letter-peek .hi {
    font-family: "Dancing Script", cursive; font-weight: 700;
    color: var(--red); font-size: clamp(26px, 7vw, 34px);
  }
  .letter-peek .mini { display: flex; gap: 8px; margin-top: 8px; }
  .letter-peek .mini img {
    width: 30%; flex: 1; aspect-ratio: 4 / 3; object-fit: cover;
    border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
  }
  .letter-peek .mini img:nth-child(1) { transform: rotate(-4deg); }
  .letter-peek .mini img:nth-child(2) { transform: rotate(3deg); }
  .letter-peek .mini img:nth-child(3) { transform: rotate(-2deg); }
  .env-front {
    position: absolute; inset: 0; z-index: 3; border-radius: 6px;
    background: linear-gradient(180deg, var(--red-light), var(--red));
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-front::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, transparent 49.6%, rgba(0, 0, 0, .12) 50%, transparent 50.8%),
                linear-gradient(200deg, transparent 49.6%, rgba(0, 0, 0, .12) 50%, transparent 50.8%);
  }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 60%;
    z-index: 4;
    background: linear-gradient(180deg, #b52238, #9b1a2e);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s ease-in, z-index 0s linear .3s;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
  }
  .seal {
    position: absolute; z-index: 5;
    left: 50%; top: 60%;
    width: 62px; height: 62px; margin: -31px 0 0 -31px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    box-shadow: 0 3px 6px rgba(60, 30, 0, .4), inset 0 0 0 5px rgba(255, 240, 190, .25);
    display: grid; place-items: center;
    font-family: "Playfair Display", serif; font-weight: 700;
    font-size: 15px; color: #7a520f;
    text-shadow: 0 1px 0 rgba(255, 240, 200, .7);
    transition: opacity .3s, transform .3s;
  }
  .seal::before {
    content: ""; position: absolute; inset: 7px; border-radius: 50%;
    border: 1.5px solid rgba(122, 82, 15, .5);
  }

  .envelope.open { cursor: default; animation: none; }
  .envelope.open .seal { opacity: 0; transform: scale(1.4); }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 1; }
  .envelope.open .letter-peek { transform: translateY(-58%); cursor: pointer; }
  .envelope.open .letter-peek:hover { transform: translateY(-62%); }

  .stage-env.opened .slot { opacity: 0; transform: translateY(-20px); pointer-events: none; }
  .stage-env.opened .title, .stage-env.opened .date { opacity: 0; }
  .stage-env.opened .mailbox { transform: translateY(70px) scale(1.06); }
  .mailbox { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }

  .btn {
    margin-top: 34px;
    border: 0; cursor: pointer;
    background: var(--red); color: #fff;
    font-family: "Lora", serif; font-size: 15px; font-weight: 500;
    padding: 12px 28px; border-radius: 999px;
    box-shadow: 0 8px 18px rgba(165, 29, 49, .3);
    transition: transform .2s, background .2s;
  }
  .btn:hover { background: var(--red-dark); transform: translateY(-2px); }
  .btn.hint { background: transparent; color: var(--red-dark); box-shadow: none; cursor: default; font-style: italic; }
  .btn.hint:hover { transform: none; }
  .stage-env.opened .btn { transform: translateY(70px); }
  .deco {
    position: absolute; font-size: 34px; pointer-events: none;
    opacity: 0; transition: opacity .6s .9s;
  }
  .stage-env.opened .deco { opacity: 1; }

  /* ---------- màn 3: lá thư + ảnh ---------- */
  .stage-letter { justify-content: flex-start; padding-top: 48px; padding-bottom: 48px; }
  .board { position: relative; width: 100%; max-width: 1280px; display: flex; flex-direction: column; align-items: center; }
  .paper {
    position: relative; z-index: 2;
    width: min(580px, 100%);
    background:
      repeating-linear-gradient(180deg, transparent 0 33px, rgba(165, 29, 49, .07) 33px 34px),
      var(--paper);
    border-radius: 6px;
    padding: 40px clamp(22px, 5vw, 48px) 36px;
    box-shadow: 0 24px 50px rgba(120, 30, 50, .18), 0 2px 0 rgba(0, 0, 0, .03);
    animation: paperIn .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  .paper::before {
    content: ""; position: absolute; left: 50%; top: -14px; width: 110px; height: 28px;
    transform: translateX(-50%) rotate(-2deg);
    background: rgba(240, 160, 180, .55);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  @keyframes paperIn { from { opacity: 0; transform: translateY(40px) scale(.92); } }
  .paper h1 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    color: var(--red); font-size: clamp(36px, 8vw, 50px);
    text-align: center; margin-bottom: 18px;
  }
  .body { font-size: clamp(16px, 2.2vw, 17.5px); line-height: 34px; text-align: justify; }
  .body .c { opacity: 0; transition: opacity .25s; }
  .body .c.on { opacity: 1; }
  .sign { margin-top: 26px; text-align: right; opacity: 0; transition: opacity .8s; }
  .sign.on { opacity: 1; }
  .sign .small { font-size: 14px; color: var(--ink-soft); font-style: italic; }
  .sign .name { font-family: "Dancing Script", cursive; font-weight: 700; font-size: 40px; color: var(--red); line-height: 1.2; }
  .sign .full { font-size: 14px; color: var(--ink-soft); letter-spacing: .04em; }
  .skip { margin-top: 10px; font-size: 13px; color: var(--ink-soft); font-style: italic; text-align: center; transition: opacity .4s; }

  .photos { display: contents; }
  .polaroid {
    --r: 0deg;
    position: absolute; z-index: 1;
    width: clamp(150px, 12.5vw, 200px);
    background: #fff;
    padding: 10px 10px 0;
    box-shadow: 0 12px 26px rgba(90, 30, 45, .22);
    transform: rotate(var(--r));
    cursor: zoom-in;
    animation: flyIn 1s cubic-bezier(.2, .8, .2, 1) both;
    transition: transform .3s, box-shadow .3s;
  }
  .polaroid:hover { transform: rotate(0deg) scale(1.06); z-index: 5; box-shadow: 0 18px 34px rgba(90, 30, 45, .3); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #eee; }
  .polaroid.wide img { aspect-ratio: 4 / 3; }
  .polaroid.sq img { aspect-ratio: 1 / 1; }
  .body.short { font-size: clamp(20px, 3vw, 24px); line-height: 34px; text-align: center; padding: 10px 0; }
  .polaroid figcaption {
    font-family: "Dancing Script", cursive; font-size: 20px; color: var(--ink);
    text-align: center; padding: 6px 0 10px;
  }
  .polaroid::before {
    content: ""; position: absolute; left: 50%; top: -10px; width: 64px; height: 20px;
    transform: translateX(-50%) rotate(3deg);
    background: rgba(255, 255, 255, .6); box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
  }
  @keyframes flyIn {
    from { opacity: 0; transform: translate(var(--fx, 0), 60px) rotate(calc(var(--r) * 3)) scale(.6); }
    to   { opacity: 1; transform: rotate(var(--r)); }
  }
  .p1 { --r: -8deg; left: 2%;  top: 0;    --fx: -120px; animation-delay: .5s; }
  .p2 { --r:  6deg; left: 8%;  top: 34%;  --fx: -120px; animation-delay: .8s; }
  .p3 { --r: -4deg; left: 2%;  top: 67%;  --fx: -120px; animation-delay: 1.1s; }
  .p4 { --r:  7deg; right: 2%; top: 2%;   --fx: 120px;  animation-delay: .65s; }
  .p5 { --r: -6deg; right: 4%; top: 36%;  --fx: 120px;  animation-delay: .95s; }
  .p6 { --r:  5deg; right: 2%; top: 67%;  --fx: 120px;  animation-delay: 1.25s; }
  .p5 { width: clamp(190px, 17vw, 250px); }
  .p1, .p4 { z-index: 3; } .p2, .p5 { z-index: 2; }
  @media (min-width: 1100px) { .board { min-height: 800px; } .paper { margin-top: 190px; } }

  .sticker { position: absolute; z-index: 3; font-size: 38px; pointer-events: none; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(6deg); } }
  .s1 { left: -22px; top: -26px; }
  .s2 { right: -18px; bottom: 90px; animation-delay: 1s; }
  .s3 { right: 28px; top: -30px; font-size: 30px; animation-delay: .5s; }

  .again { margin-top: 36px; }

  @media (max-width: 1099px) {
    .photos {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 26px 18px; margin-top: 44px; width: 100%; max-width: 640px;
    }
    .polaroid { position: relative; left: auto; right: auto; top: auto; width: calc(50% - 18px); max-width: 230px; }
    .p5 { width: calc(100% - 30px); max-width: 360px; }
  }

  /* ---------- xem ảnh to ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(50, 15, 25, .82);
    display: grid; place-items: center; padding: 24px 16px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
    cursor: zoom-out;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox figure { background: #fff; padding: 12px 12px 0; max-width: min(92vw, 720px); transform: scale(.94); transition: transform .3s; }
  .lightbox.show figure { transform: scale(1); }
  .lightbox img { display: block; max-width: 100%; max-height: 74vh; margin: 0 auto; }
  .lightbox figcaption { font-family: "Dancing Script", cursive; font-size: 24px; text-align: center; padding: 8px 0 12px; }

  /* ---------- nền căn phòng màu nước (màn lá thư) ---------- */
  .room {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity 1s;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.3'/></svg>"),
      radial-gradient(60vw 50vh at 50% 18%, rgba(255, 249, 240, .85), transparent 70%),
      radial-gradient(40vw 40vh at 12% 70%, rgba(236, 178, 178, .45), transparent 70%),
      radial-gradient(45vw 45vh at 88% 60%, rgba(240, 190, 186, .5), transparent 70%),
      radial-gradient(30vw 30vh at 70% 10%, rgba(250, 214, 205, .6), transparent 70%),
      linear-gradient(180deg, #f9ede7 0%, #f5e0da 55%, #efd2cc 100%);
  }
  body.is-letter .room { opacity: 1; }
  .room .curtain {
    position: absolute; top: 0; bottom: 0; width: 17vw;
    background: repeating-linear-gradient(90deg,
      rgba(255, 255, 255, .34) 0 16px, rgba(232, 182, 182, .26) 16px 34px,
      rgba(255, 250, 246, .22) 34px 50px, rgba(226, 170, 172, .2) 50px 62px);
    filter: blur(3px);
  }
  .room .curtain.l { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent); mask-image: linear-gradient(90deg, #000 55%, transparent); }
  .room .curtain.r { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 55%, transparent); mask-image: linear-gradient(270deg, #000 55%, transparent); }
  .room .ledge {
    position: absolute; left: 0; right: 0; bottom: 0; height: 9vh;
    background: linear-gradient(180deg, rgba(222, 172, 166, .55), rgba(200, 146, 142, .55));
    box-shadow: 0 -2px 0 rgba(255, 255, 255, .35), 0 -14px 30px rgba(180, 120, 120, .18);
  }
  .room svg { position: absolute; overflow: visible; filter: url(#wc); }
  .room .hang  { top: 0; left: 0; width: min(46vw, 520px); aspect-ratio: 420 / 300; opacity: .7; }
  .room .vase  { right: 2vw; bottom: 5vh; height: 64vh; width: auto; aspect-ratio: 300 / 520; opacity: .8; }
  .room .plant { left: 1.5vw; bottom: 5vh; height: 48vh; width: auto; aspect-ratio: 260 / 420; opacity: .8; }
  @media (max-width: 700px) {
    .room .curtain { width: 12vw; }
    .room .vase { height: 40vh; opacity: .5; }
    .room .plant { height: 30vh; opacity: .5; }
    .room .hang { width: 70vw; opacity: .55; }
  }

  /* ---------- hiệu ứng hoa nở ---------- */
  .bloom {
    position: fixed; inset: 0; z-index: 40; overflow: hidden; pointer-events: none;
    background: rgba(248, 226, 228, 0);
    transition: background .8s 1.2s;
  }
  .bloom.full { background: rgba(248, 226, 228, 1); }
  .bloom.out { background: rgba(248, 226, 228, 0); transition-delay: 0s; transition-duration: .5s; }
  .bf {
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s);
    transform: translate(var(--x), var(--y)) rotate(var(--r1));
    animation: bfIn 1.1s cubic-bezier(.2, .9, .3, 1) var(--d) both;
    will-change: transform, opacity;
  }
  .bf svg { width: 100%; height: 100%; overflow: visible; display: block; }
  @keyframes bfIn {
    from { transform: translate(var(--x), var(--y)) rotate(var(--r0)) scale(.05); opacity: 0; }
    25%  { opacity: 1; }
  }
  .bf .ly { transform-origin: 0px 0px; animation: lyOpen 1.3s cubic-bezier(.2, .9, .3, 1) both; }
  .bf .ly1 { animation-delay: calc(var(--d) + .05s); }
  .bf .ly2 { animation-delay: calc(var(--d) + .16s); }
  .bf .ly3 { animation-delay: calc(var(--d) + .28s); }
  @keyframes lyOpen { from { transform: scale(.2) rotate(-35deg); } }
  .bloom.out .bf { animation: bfOut 1s ease-in var(--d2) forwards; }
  @keyframes bfOut {
    to { transform: translate(var(--x), var(--y)) rotate(calc(var(--r1) + 25deg)) scale(1.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petals, .bloom { display: none; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="defs">
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
      <feGaussianBlur stdDeviation=".5"/>
    </filter>
  </defs>
</svg>

<div class="room" aria-hidden="true">
  <div class="curtain l"></div>
  <div class="curtain r"></div>
  <div class="ledge"></div>
  <svg class="hang" id="svgHang" viewBox="0 0 420 300"></svg>
  <svg class="plant" id="svgPlant" viewBox="0 0 260 420"></svg>
  <svg class="vase" id="svgVase" viewBox="0 0 300 520"></svg>
</div>
<div class="petals" aria-hidden="true"></div>
<div class="bloom" id="bloom" aria-hidden="true" hidden></div>

<!-- Màn 1 & 2: hộp thư + phong bì -->
<section class="stage stage-env" id="stageEnv">
  <h2 class="title">Dì Thuý ơi, có thư nè!</h2>
  <p class="date">20 · 10 · 2026</p>

  <div class="mailbox">
    <span class="deco" style="left:-34px; top:40px">💐</span>
    <span class="deco" style="right:-30px; top:150px">🌷</span>
    <div class="slot" aria-hidden="true"></div>
    <div class="window" id="window">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở phong bì">
        <div class="env-back"></div>
        <div class="letter-peek" id="letterPeek" role="button" tabindex="-1" aria-label="Đọc thư">
          <div class="hi">Gửi dì Thuý</div>
          <div class="mini">
            <img src="anh/anh-2.jpg" alt="">
            <img src="anh/anh-4.jpg" alt="">
            <img src="anh/anh-6.jpg" alt="">
          </div>
        </div>
        <div class="env-front"></div>
        <div class="flap"></div>
        <div class="seal">20/10</div>
      </div>
    </div>
  </div>

  <button class="btn" id="btn">bấm vào đây</button>
</section>

<!-- Màn 3: lá thư + ảnh -->
<section class="stage stage-letter" id="stageLetter" hidden>
  <div class="board">
    <article class="paper" id="paper">
      <span class="sticker s1">🌸</span>
      <span class="sticker s3">🎀</span>
      <span class="sticker s2">💐</span>
      <h1>Gửi dì Thuý,</h1>
      <p class="body short" id="body"></p>
      <div class="sign" id="sign">
        <div class="small">Ký tên</div>
        <div class="name">Vi</div>
        <div class="full">Vũ Vi Tường Vi</div>
      </div>
      <p class="skip" id="skip">chạm vào lá thư để hiện hết chữ</p>
    </article>

    <div class="photos" id="photos">
      <figure class="polaroid p1 sq"><img src="anh/anh-2.jpg" alt="Dì Thuý và chú mặc áo dài"><figcaption>dì &amp; chú</figcaption></figure>
      <figure class="polaroid p2 wide"><img src="anh/anh-1.jpg" alt="Dì Thuý và em bé chụp với vẹt"><figcaption>đi chơi vườn chim</figcaption></figure>
      <figure class="polaroid p3 sq"><img src="anh/anh-6.jpg" alt="Dì Thuý bên chậu sen đá"><figcaption>dì &amp; sen đá</figcaption></figure>
      <figure class="polaroid p4 sq"><img src="anh/anh-3.jpg" alt="Dì Thuý và chú đi chơi"><figcaption>đi chơi cùng chú</figcaption></figure>
      <figure class="polaroid p5 wide"><img src="anh/anh-4.jpg" alt="Cả nhà dì ngày tốt nghiệp"><figcaption>ngày tốt nghiệp</figcaption></figure>
      <figure class="polaroid p6 sq"><img src="anh/anh-5.jpg" alt="Dì Thuý đi du lịch"><figcaption>dì xinh nè</figcaption></figure>
    </div>
  </div>

  <button class="btn again" id="again">đọc lại từ đầu</button>
</section>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
</div>

<script>
  const LETTER = "Cháu chúc dì Thuý 20/10 luôn vui vẻ, hạnh phúc và xinh đẹp ❤";

  const $ = (id) => document.getElementById(id);
  const stageEnv = $("stageEnv"), stageLetter = $("stageLetter");
  const envelope = $("envelope"), win = $("window"), btn = $("btn");
  let state = "closed"; // closed -> ready -> open
  let typing = null;

  // cánh hoa rơi
  const petals = document.querySelector(".petals");
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = 9 + Math.random() * 9 + "s";
    p.style.animationDelay = -Math.random() * 18 + "s";
    const s = 0.6 + Math.random() * 0.8;
    p.style.width = 14 * s + "px"; p.style.height = 11 * s + "px";
    petals.appendChild(p);
  }

  // phong bì trượt ra khỏi khe thư
  setTimeout(() => envelope.classList.add("out"), 350);

  function ready() {
    if (state !== "closed") return;
    state = "ready";
    btn.textContent = "chạm vào phong bì để mở nhé";
    btn.classList.add("hint");
    envelope.classList.add("wiggle");
  }

  function openEnvelope() {
    if (state === "open" || state === "letter") return;
    state = "open";
    stageEnv.classList.add("opened");
    win.classList.add("free");
    envelope.classList.remove("wiggle");
    envelope.classList.add("open");
    btn.textContent = "chạm vào lá thư để đọc nhé 💌";
    btn.classList.add("hint");
    $("letterPeek").tabIndex = 0;
  }

  function showLetter() {
    if (state === "letter") return;
    state = "letter";
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { swapToLetter(); typeLetter(); return; }
    // hoa nở kín màn hình -> đổi cảnh phía sau -> hoa tan ra
    const bloom = $("bloom");
    const maxD = growBloom(bloom);
    const covered = (maxD + 1.1) * 1000;
    bloomTimers = [
      setTimeout(() => bloom.classList.add("full"), 10),
      setTimeout(swapToLetter, covered),
      setTimeout(() => { bloom.classList.add("out"); typeLetter(); }, covered + 250),
      setTimeout(clearBloom, covered + 2200),
    ];
  }

  function swapToLetter() {
    stageEnv.hidden = true;
    stageLetter.hidden = false;
    document.body.classList.add("is-letter");
    window.scrollTo(0, 0);
  }

  // ---------- hoa ----------
  const PAL = {
    pink:  ["#d65f80", "#f29bb3", "#fde3ea"],
    blush: ["#e48ea3", "#f8c5cf", "#fff2f3"],
    cream: ["#e6c39c", "#f8e5cd", "#fffaf2"],
    red:   ["#8e1427", "#c8344c", "#ee8592"],
    coral: ["#de5d77", "#f7a1a8", "#ffe2dd"],
    lilac: ["#cf8db0", "#efc1d7", "#fbe9f2"],
  };
  const NS = "http://www.w3.org/2000/svg";
  (function makeGradients() {
    let html = "";
    for (const [k, [a, b, c]] of Object.entries(PAL)) {
      html += `<radialGradient id="g-${k}" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="48"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
      html += `<radialGradient id="h-${k}" cx=".5" cy="1" r="1"><stop offset="0" stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
    }
    $("defs").insertAdjacentHTML("beforeend", html);
  })();

  const P_ROSE = "M0 -5 C -30 -6 -33 -45 0 -47 C 33 -45 30 -6 0 -5Z";
  const P_PEONY = "M0 -3 C -22 -4 -24 -42 0 -44 C 24 -42 22 -4 0 -3Z";
  const P_LILY = "M0 0 C -12 -12 -10 -36 0 -49 C 10 -36 12 -12 0 0Z";
  const P_FLORET = "M0 0 C -7 -3 -7 -12 0 -13 C 7 -12 7 -3 0 0Z";
  const LINE = 'stroke="rgba(110,20,45,.18)" stroke-width=".8"';

  function ring(n, d, scale, offset, fill) {
    let s = "";
    for (let i = 0; i < n; i++) {
      const a = offset + (360 / n) * i + (Math.random() * 10 - 5);
      s += `<path d="${d}" transform="rotate(${a.toFixed(1)}) scale(${scale})" fill="${fill}" ${LINE}/>`;
    }
    return s;
  }
  const flowers = {
    rose(k) {
      const f = `url(#g-${k})`, [a, , c] = PAL[k];
      return `<g class="ly ly1">${ring(5, P_ROSE, 1, 0, f)}</g>
        <g class="ly ly2">${ring(5, P_ROSE, .72, 36, f)}</g>
        <g class="ly ly3">${ring(4, P_ROSE, .46, 15, f)}<circle r="8" fill="${a}"/>
        <path d="M-5 1 A5 5 0 1 1 3 -4 M-2 3 A3 3 0 1 0 2 -1" fill="none" stroke="${c}" stroke-width="1.3" opacity=".75"/></g>`;
    },
    peony(k) {
      const f = `url(#g-${k})`;
      let dots = "";
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 * i) / 12;
        dots += `<circle cx="${(Math.cos(a) * 9).toFixed(1)}" cy="${(Math.sin(a) * 9).toFixed(1)}" r="1.8" fill="#c98a1c"/>`;
      }
      return `<g class="ly ly1">${ring(9, P_PEONY, 1, 0, f)}</g>
        <g class="ly ly2">${ring(8, P_PEONY, .74, 20, f)}</g>
        <g class="ly ly3">${ring(6, P_PEONY, .5, 8, f)}<circle r="9" fill="#f2c64e"/>${dots}</g>`;
    },
    lily(k) {
      const f = `url(#g-${k})`, [a] = PAL[k];
      const petals = (start, scale) => {
        let s = "";
        for (let i = 0; i < 3; i++) {
          const r = start + i * 120;
          s += `<g transform="rotate(${r}) scale(${scale})"><path d="${P_LILY}" fill="${f}" ${LINE}/>
            <path d="M0 -4 L0 -40" stroke="${a}" stroke-width="1" opacity=".5"/>
            <circle cx="-3" cy="-16" r="1.3" fill="${a}"/><circle cx="2.5" cy="-21" r="1.2" fill="${a}"/>
            <circle cx="-2" cy="-27" r="1" fill="${a}"/><circle cx="3" cy="-13" r="1" fill="${a}"/></g>`;
        }
        return s;
      };
      let st = "";
      for (let i = 0; i < 6; i++) {
        const r = i * 60 + 30;
        st += `<g transform="rotate(${r})"><path d="M0 0 L0 -25" stroke="#9fb27a" stroke-width="1.2"/><ellipse cy="-26" rx="1.6" ry="3.6" fill="#8a4a22"/></g>`;
      }
      return `<g class="ly ly1">${petals(0, 1)}</g><g class="ly ly2">${petals(60, .9)}</g><g class="ly ly3">${st}<circle r="3" fill="#cfe0a8"/></g>`;
    },
    hydrangea(k) {
      const f = `url(#h-${k})`;
      const floret = (x, y, s) => {
        const r = Math.random() * 90;
        let p = "";
        for (let i = 0; i < 4; i++) p += `<path d="${P_FLORET}" transform="rotate(${r + i * 90})" fill="${f}" ${LINE}/>`;
        return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s})">${p}<circle r="1.7" fill="#fff" opacity=".8"/></g>`;
      };
      const ringOf = (n, rad, s) => {
        let out = "";
        for (let i = 0; i < n; i++) {
          const a = (Math.PI * 2 * i) / n + Math.random() * .3;
          out += floret(Math.cos(a) * rad, Math.sin(a) * rad, s);
        }
        return out;
      };
      return `<g class="ly ly1">${ringOf(9, 29, 1)}</g><g class="ly ly2">${ringOf(6, 15, 1)}</g><g class="ly ly3">${floret(0, 0, 1.05)}</g>`;
    },
  };
  const TYPES = [
    ["rose", ["pink", "blush", "red", "coral", "pink"]],
    ["rose", ["blush", "cream", "pink"]],
    ["peony", ["cream", "blush", "cream"]],
    ["lily", ["pink", "coral", "blush"]],
    ["hydrangea", ["lilac", "blush", "pink"]],
  ];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function growBloom(el) {
    el.innerHTML = "";
    el.className = "bloom";
    el.hidden = false;
    const W = innerWidth, H = innerHeight;
    const sp = W < 700 ? 86 : 128;
    const rowH = sp * .86;
    const cx = W / 2, cy = H / 2;
    const items = [];
    for (let row = -1; row * rowH < H + sp; row++) {
      for (let col = -1; col * sp < W + sp; col++) {
        const x = col * sp + (row % 2 ? sp / 2 : 0) + (Math.random() - .5) * sp * .35;
        const y = row * rowH + (Math.random() - .5) * sp * .35;
        items.push({ x, y, d: Math.hypot(x - cx, (y - cy) * 1.15) });
      }
    }
    const maxDist = Math.max(...items.map((i) => i.d));
    let html = "";
    items.sort(() => Math.random() - .5).forEach(({ x, y, d }) => {
      const [type, cols] = pick(TYPES);
      const s = sp * (1.45 + Math.random() * .4);
      const delay = (d / maxDist) * 1.25 + Math.random() * .15;
      const r1 = Math.random() * 360;
      html += `<div class="bf" style="--x:${(x - s / 2).toFixed(0)}px;--y:${(y - s / 2).toFixed(0)}px;--s:${s.toFixed(0)}px;--d:${delay.toFixed(2)}s;--d2:${((d / maxDist) * .55 + Math.random() * .15).toFixed(2)}s;--r0:${(r1 - 90).toFixed(0)}deg;--r1:${r1.toFixed(0)}deg">
        <svg viewBox="-50 -50 100 100">${flowers[type](pick(cols))}</svg></div>`;
    });
    el.innerHTML = html;
    return 1.4;
  }

  let bloomTimers = [];
  function clearBloom() {
    const bloom = $("bloom");
    bloom.hidden = true;
    bloom.innerHTML = "";
    bloom.className = "bloom";
  }

  // ---------- cành lá màu nước trên nền ----------
  function drawBotanicals() {
    const LEAF = (len, w) => `M0 0 C ${w} ${-len * .3} ${w} ${-len * .75} 0 ${-len} C ${-w} ${-len * .75} ${-w} ${-len * .3} 0 0Z`;
    function stem(svg, d, o) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", o.stemColor || "#a08a78");
      p.setAttribute("stroke-width", o.width || 1.6);
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("opacity", ".7");
      svg.appendChild(p);
      const L = p.getTotalLength();
      let out = "";
      const n = Math.floor(L / o.gap);
      for (let i = 1; i <= n; i++) {
        const t = (i / n) * L;
        const a = p.getPointAtLength(Math.max(0, t - 1)), b = p.getPointAtLength(t);
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90;
        const side = i % 2 ? 1 : -1;
        if (o.blossom && Math.random() < o.blossom) {
          const r = 5 + Math.random() * 4, c = pick(["#f2b3c1", "#eb98ac", "#f7cbd3", "#e98aa1"]);
          let pet = "";
          for (let k = 0; k < 5; k++) pet += `<ellipse cx="0" cy="${-r * .6}" rx="${r * .55}" ry="${r * .7}" fill="${c}" transform="rotate(${k * 72})"/>`;
          out += `<g transform="translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${Math.random() * 72})" opacity=".85">${pet}<circle r="${r * .25}" fill="#f6dc9c"/></g>`;
        } else {
          const len = o.leafLen * (.7 + Math.random() * .5);
          const tilt = ang + side * (o.spread || 45) - 90;
          out += `<path d="${o.round ? `M0 0 m-${len * .4} 0 a${len * .4} ${len * .4} 0 1 0 ${len * .8} 0 a${len * .4} ${len * .4} 0 1 0 -${len * .8} 0` : LEAF(len, len * o.leafW)}"
            transform="translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${(tilt + 90).toFixed(0)})${o.round ? ` translate(0 ${-len * .4})` : ""}"
            fill="${pick(o.leafColors)}" opacity="${(.45 + Math.random() * .35).toFixed(2)}"/>`;
        }
      }
      svg.insertAdjacentHTML("beforeend", out);
    }

    // cành rủ góc trên trái
    const hang = $("svgHang");
    [["M0 10 C 90 30 170 90 230 210", 0], ["M20 0 C 120 10 250 40 330 140", 0], ["M0 40 C 50 90 80 170 90 280", 0], ["M60 0 C 170 0 330 10 410 70", 0]]
      .forEach(([d]) => stem(hang, d, { gap: 12, leafLen: 22, leafW: .28, spread: 35, leafColors: ["#a9b993", "#bfc9a5", "#98aa86"] }));

    // chậu cây bạch đàn góc dưới trái
    const plant = $("svgPlant");
    plant.insertAdjacentHTML("beforeend", `<path d="M78 330 L182 330 L170 418 L90 418Z" fill="#e8cfc0" opacity=".9"/><rect x="72" y="320" width="116" height="16" rx="4" fill="#dcbcab"/>`);
    ["M130 322 C 120 240 70 180 40 60", "M130 322 C 135 230 140 140 150 20", "M130 322 C 150 250 200 180 230 90", "M130 322 C 110 270 60 250 20 210", "M130 322 C 160 280 210 270 245 240"]
      .forEach((d) => stem(plant, d, { gap: 15, leafLen: 15, round: true, leafColors: ["#a7b79a", "#b9c5a8", "#93a487"] }));

    // bình hoa cành đào góc dưới phải
    const vase = $("svgVase");
    ["M150 340 C 120 250 70 160 50 40", "M150 340 C 150 240 145 120 160 10", "M150 340 C 180 260 230 160 265 60", "M150 340 C 110 290 50 250 15 200", "M150 340 C 200 300 250 260 290 230"]
      .forEach((d) => stem(vase, d, { gap: 13, leafLen: 14, leafW: .3, blossom: .45, stemColor: "#8d6e60", leafColors: ["#b3bf98", "#a2b18c"] }));
    vase.insertAdjacentHTML("beforeend", `<path d="M112 520 C 80 470 86 420 120 392 C 128 380 126 360 120 350 L180 350 C 174 360 172 380 180 392 C 214 420 220 470 188 520Z" fill="#f4e8dc" opacity=".95"/>
      <path d="M128 400 C 112 430 112 470 126 505" stroke="#fff" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>`);
  }
  drawBotanicals();

  function typeLetter() {
    const body = $("body"), sign = $("sign"), skip = $("skip");
    body.innerHTML = "";
    sign.classList.remove("on");
    skip.style.opacity = 1;
    const chars = [...LETTER].map((ch) => {
      const s = document.createElement("span");
      s.className = "c"; s.textContent = ch;
      body.appendChild(s);
      return s;
    });
    let i = 0;
    clearInterval(typing);
    setTimeout(() => {
      typing = setInterval(() => {
        if (i < chars.length) chars[i++].classList.add("on");
        else finish();
      }, 32);
    }, 700);
    function finish() {
      clearInterval(typing); typing = null;
      chars.forEach((c) => c.classList.add("on"));
      sign.classList.add("on");
      skip.style.opacity = 0;
    }
    $("paper").onclick = () => { if (typing !== null || !sign.classList.contains("on")) finish(); };
  }

  function reset() {
    clearInterval(typing);
    bloomTimers.forEach(clearTimeout);
    clearBloom();
    document.body.classList.remove("is-letter");
    stageLetter.hidden = true;
    stageEnv.hidden = false;
    stageEnv.classList.remove("opened");
    win.classList.remove("free");
    envelope.className = "envelope";
    btn.textContent = "bấm vào đây";
    btn.classList.remove("hint");
    state = "closed";
    window.scrollTo(0, 0);
    setTimeout(() => envelope.classList.add("out"), 350);
  }

  btn.addEventListener("click", () => { if (state === "closed") ready(); });
  envelope.addEventListener("click", (e) => {
    if (state === "open") {
      if (e.target.closest("#letterPeek")) showLetter();
      return;
    }
    openEnvelope();
  });
  envelope.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    state === "open" ? showLetter() : openEnvelope();
  });
  $("again").addEventListener("click", reset);

  // xem ảnh to
  const lb = $("lightbox");
  document.querySelectorAll(".polaroid").forEach((f) => {
    f.addEventListener("click", () => {
      $("lbImg").src = f.querySelector("img").src;
      $("lbImg").alt = f.querySelector("img").alt;
      $("lbCap").textContent = f.querySelector("figcaption").textContent;
      lb.classList.add("show");
    });
  });
  lb.addEventListener("click", () => lb.classList.remove("show"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") lb.classList.remove("show"); });
</script>
</body>
</html>
